name: Archive club history

# Saves the live season's match-level data from the official FPL API into
# data/club-history/ before FPL deletes it at the end of the season (see
# scripts/club-history/archive-current.ts). Twice a week so a weekend
# round and a midweek round are each caught soon after they finish; the
# archive is cumulative, so a missed run loses nothing. Once a season's
# last fixture has finished, build-aggregates.ts moves it into the app's
# bundled completed seasons, and this workflow releases it as the next
# patch version — well before FPL's summer reset, with no one needing to
# remember.

on:
  schedule:
    - cron: "0 5 * * 2" # Tuesday 05:00 UTC, after Monday night football
    - cron: "0 5 * * 5" # Friday 05:00 UTC, after a midweek round
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Also release this tag (e.g. v1.74.0) after archiving — for testing the release step or releasing by hand"
        required: false
        type: string

permissions:
  contents: write
  actions: write # re-enabling this schedule, and starting release.yml

concurrency:
  group: club-history-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      # GitHub switches off a public repository's scheduled workflows after
      # 60 days without activity. The summer break is longer than that and
      # has nothing new to archive, so no commit — this schedule would be
      # off when next season starts. Re-enabling it on every run restarts
      # that clock. First, so a failed archive run still keeps it on.
      - name: Keep this schedule switched on
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/club-history-archive.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The scripts only use Node built-ins plus server/src/clubHistory
      # (dependency-free), so tsx is all they need — no full npm ci.
      - name: Archive the live season
        run: npx --yes tsx@4 scripts/club-history/archive-current.ts

      - name: Rebuild completed-season aggregates
        run: npx --yes tsx@4 scripts/club-history/build-aggregates.ts

      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/club-history server/src/clubHistory/completedSeasons.generated.ts
          if git diff --cached --quiet; then
            echo "No changes to archive."
            exit 0
          fi
          # The bundled seasons only change when a season has just been
          # completed (or FPL corrects one before its summer reset) — the
          # app needs a release to show it.
          if git diff --cached --name-only | grep -q completedSeasons.generated.ts; then
            echo "bundled_changed=true" >> "$GITHUB_OUTPUT"
          fi
          git commit -m "Archive club history ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push

      # Tags the next patch version (v1.74.0 → v1.74.1) and starts the
      # release build on it. A tag pushed from here doesn't fire release.yml's
      # push trigger, so it's started explicitly.
      - name: Release the updated seasons
        if: steps.commit.outputs.bundled_changed == 'true' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git fetch --tags --quiet
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
            IFS=. read -r major minor patch <<< "${latest#v}"
            tag="v$major.$minor.$((patch + 1))"
          fi
          echo "Releasing $tag"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
          gh workflow run release.yml --ref "$tag"
