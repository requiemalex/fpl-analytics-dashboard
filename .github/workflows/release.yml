name: Release desktop app

# Fires on the exact same git tag convention this project already uses
# for every versioned change (`git tag -a vX.Y.Z && git push origin
# vX.Y.Z`) — tagging a release now also builds and publishes the
# Windows installer, so every installed copy's electron-updater picks it
# up automatically. No separate release process to remember.
on:
  push:
    tags:
      - "v*"
  # The club-history archive starts this on a tag it has just pushed (a
  # tag pushed from a workflow doesn't fire the push trigger above) — see
  # club-history-archive.yml. Only ever run on a v* tag.
  workflow_dispatch:

permissions:
  contents: write # electron-builder needs this to create the GitHub Release and upload assets
  actions: read # the alert step reads run history
  issues: write # the alert issue (scripts/alerts/)

# One release build at a time (a hand-pushed tag and the club-history
# archive's could otherwise overlap, each pruning while the other publishes).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      # Full history and tags: the release page's change list is read from git (scripts/release/notes.ts).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      # electron-builder reads package.json's version to name the release
      # and the installer file. Deriving it from the pushed tag here means
      # the tag is the one source of truth for the version — exactly like
      # this project's existing (non-Electron) release process already
      # works — instead of relying on someone remembering to also bump
      # package.json by hand before tagging.
      - name: Set package version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Run this on a v* tag, not $GITHUB_REF"
            exit 1
          fi
          npm pkg set version="${GITHUB_REF#refs/tags/v}"

      # Uploads to a draft release (package.json's build.publish.releaseType):
      # installed apps never see a draft.
      - run: npm run electron:build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only now, with the installer, its blockmap and latest.yml all
      # uploaded, does the release go public. Published as it was being
      # uploaded, an app checking in that minute could find latest.yml
      # naming an installer that wasn't there yet (audit 2026-10-23,
      # finding 9). If this step fails, the release stays a draft and the
      # alert below fires; installed apps keep the previous version.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | tee assets.txt
          grep -qx "latest.yml" assets.txt
          grep -qE '^Scoutline-Setup-.*\.exe$' assets.txt
          grep -qE '^Scoutline-Setup-.*\.exe\.blockmap$' assets.txt
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      # The version's changes on its Releases page (docs/RELEASES.md keeps every
      # release's, since this page is pruned below). Failing here leaves the
      # page without its list, never the release unpublished.
      - name: Add the change list to the release page
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run -s release-notes -- --list "$GITHUB_REF_NAME" > notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md

      # Keeps the Releases page from accumulating every installer ever
      # built — deletes the release (and its uploaded .exe/.blockmap/
      # latest.yml assets) for anything beyond the 5 most recent. Tags
      # themselves are left alone (cheap, useful history); only the
      # built artifacts get pruned.
      - name: Prune old releases (keep latest 5)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          old_releases=$(gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName')
          for tag in $old_releases; do
            echo "Deleting old release $tag"
            gh release delete "$tag" --yes
          done

      # Alerts the owner at once if the release failed (installed apps would
      # stop updating — nothing retries it), and closes that alert when a
      # later release works. See scripts/alerts/.
      - name: Alert or resolve
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx --yes tsx@4 scripts/alerts/workflow-alert.ts --key release --workflow release.yml
          --outcome "${{ job.status }}" --policy immediate
          --title "Action needed: app release failed"
          --what "Building or publishing the desktop app for ${{ github.ref_name }} failed."
          --impact "Installed apps stay on the previous version (they keep working) and won't get this update until a release succeeds."
